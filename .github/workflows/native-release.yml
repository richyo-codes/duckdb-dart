name: Native binary release
on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the completed binaries to a draft GitHub release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, android-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' > /dev/null
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Build shared library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          dart tools/build_native.dart --target '${{ matrix.target }}' --output build/native --jobs 2
      - name: Inspect ELF architecture and load alignment
        run: |
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -l build/native/libduckdb.so
      - name: Package binary and checksum
        run: python3 tools/package_native.py --target '${{ matrix.target }}' --library-dir build/native --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  ios:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [ios-arm64, ios-simulator-arm64, ios-simulator-x64]
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Build shared library
        run: dart tools/build_native.dart --target '${{ matrix.target }}' --output build/native --jobs 2
      - name: Inspect Mach-O dependencies and target platform
        run: |
          otool -L build/native/libduckdb.dylib
          xcrun vtool -show-build build/native/libduckdb.dylib
      - name: Package binary and checksum
        run: python3 tools/package_native.py --target '${{ matrix.target }}' --library-dir build/native --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  upload:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: duckdb-*
          path: dist
          merge-multiple: true
      - name: Validate and upload immutable assets to a draft release
        run: python3 tools/publish_native.py --directory dist
        env:
          GH_TOKEN: ${{ github.token }}
